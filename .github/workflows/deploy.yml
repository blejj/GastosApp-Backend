name: Deploy GastosApp API to Azure

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore ./src/GastosApp.API/GastosApp.API.csproj

      - name: Build
        run: dotnet build ./src/GastosApp.API/GastosApp.API.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish ./src/GastosApp.API/GastosApp.API.csproj --configuration Release --no-build --output ./publish

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: gastosapp-api-franco
          package: ./publish